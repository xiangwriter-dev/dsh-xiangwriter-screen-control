name: Bug report
description: Something in dsh-screen-control does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Screenshots help, but remember that captures contain the whole screen — redact anything private first.
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.2.1-rc.2
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (build 26100)
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      description: Output of `$PSVersionTable.PSVersion` in `powershell.exe`.
      placeholder: 5.1.22621.5697
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: The tool call and the result
      description: Paste the arguments you used and the exact error message.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Multi-monitor setup, elevated windows, remote desktop, locked screen, etc.
